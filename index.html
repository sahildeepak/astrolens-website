  <!-- SCRIPT: DOM-ready, server-first interpret call; no rulebook on client -->
  <script>
  // Small local IntentParser for minimal client-side heuristics (no rulebook)
  class IntentParser {
    constructor() {
      this.keywords = {
        mounts: { "jupiter": ["jupiter","index finger","guru"], "sun": ["sun","ring finger","apollo"], "saturn": ["saturn","middle finger","fate"], "mercury": ["mercury","little finger","pinky"] },
        signs:  { "cross": ["cross"," x " ," x,"], "star": ["star"], "island": ["island","circle"], "mole": ["mole","spot"], "vertical_line": ["vertical line","straight line"], "vertical_lines": ["multiple lines","healing lines","vertical lines"], "net": ["net","grille","grid"] }
      };
    }
    parse(text) {
      const lower = (text||'').toLowerCase();
      let mount = null, sign = null;
      for (const [k, arr] of Object.entries(this.keywords.mounts)) if (arr.some(w => lower.includes(w))) mount = k;
      for (const [k, arr] of Object.entries(this.keywords.signs)) if (arr.some(w => lower.includes(w))) sign = k;
      return { mount, sign, confidence: 0.5 };
    }
  }

  // everything runs after DOMContentLoaded so elements exist
  document.addEventListener('DOMContentLoaded', () => {
    const parser = new IntentParser();

    // safe element getter & attach
    function safeGet(id) { return document.getElementById(id) || null; }
    function safeAddListener(id, ev, fn) { const el = safeGet(id); if (el) el.addEventListener(ev, fn); }

    const chatMessages = safeGet('chat-messages');
    const userInput = safeGet('user-input');
    const btnScan = safeGet('btn-scan');

    // helper UI functions
    function addAiMessage(html) {
      if (!chatMessages) return;
      const d = document.createElement('div');
      d.className = 'chat-bubble-ai';
      d.innerHTML = html;
      chatMessages.appendChild(d);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    function addUserMessage(text) {
      if (!chatMessages) return;
      const d = document.createElement('div');
      d.className = 'chat-bubble-user';
      d.innerText = text;
      chatMessages.appendChild(d);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    function showTyping() {
      if (!chatMessages) return;
      const typingDiv = document.createElement('div');
      typingDiv.className = 'chat-bubble-ai typing-indicator';
      typingDiv.id = 'typing-indicator';
      typingDiv.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
      chatMessages.appendChild(typingDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    function removeTyping() { const t = document.getElementById('typing-indicator'); if (t) t.remove(); }

    // sendMessage: prefer server /api/interpret; fallback to client parser-only behavior
    async function sendMessage() {
      if (!userInput) return;
      const text = (userInput.value || '').trim();
      if (!text) return;
      addUserMessage(text);
      userInput.value = '';
      showTyping();

      try {
        // POST to server endpoint - server should hold rulebook and keys
        const res = await fetch('/api/interpret', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });

        removeTyping();

        if (!res.ok) {
          // non-2xx: fallback
          const txt = await res.text().catch(()=>null);
          addAiMessage(`<p>Server error (${res.status}). Using a local fallback parser. Message: ${txt || 'no body'}</p>`);
          // local fallback
          const facts = parser.parse(text);
          addAiMessage(`<p>Local fallback detected mount: <strong>${facts.mount || 'unknown'}</strong>, sign: <strong>${facts.sign || 'unknown'}</strong></p><p class="text-gray-500 text-sm mt-3">For full readings enable /api/interpret on your server (Netlify function).</p>`);
          return;
        }

        const payload = await res.json().catch(()=>null);
        if (!payload) {
          addAiMessage('<p>Invalid server response. Using local fallback.</p>');
          const facts = parser.parse(text);
          addAiMessage(`<p>Local fallback detected mount: <strong>${facts.mount || 'unknown'}</strong>, sign: <strong>${facts.sign || 'unknown'}</strong></p>`);
          return;
        }

        // server should return an object { event: {...}, facts: {...}, meta: {...} }
        if (payload.event && payload.event.type === 'reading_match') {
          const result = payload.event.params;
          const html = `
            <span class="text-amber-500 font-bold uppercase text-xs tracking-widest">${result.planet}</span>
            <p class="text-gray-400 text-[10px] mb-2">Activation Age: ${result.age}</p>
            <p class="mb-3">${result.prediction}</p>
            <div class="bg-amber-900/20 border-l-2 border-amber-500 p-2 mt-2">
              <p class="text-xs text-amber-200"><strong>Lal Kitab Remedy:</strong> ${result.remedy}</p>
            </div>
          `;
          addAiMessage(html);
        } else if (payload.event && payload.event.type === 'no_sign_match') {
          addAiMessage(`<p>${payload.event.params.message}</p><p class="text-gray-500 text-sm mt-3">Try asking about another sign like <strong>Star, Cross, or Vertical Line</strong>.</p>`);
        } else {
          // server didn't find a match - show server facts if present or fallback parser
          if (payload.facts) {
            addAiMessage(`<p>Detected (server): mount=<strong>${payload.facts.mount || 'unknown'}</strong>, sign=<strong>${payload.facts.sign || 'unknown'}</strong></p>`);
          } else {
            const facts = parser.parse(text);
            addAiMessage(`<p>Local fallback detected mount: <strong>${facts.mount || 'unknown'}</strong>, sign: <strong>${facts.sign || 'unknown'}</strong></p><p class="text-gray-500 text-sm mt-3">Enable server interpret endpoint for full readings.</p>`);
          }
        }
      } catch (err) {
        removeTyping();
        console.error('interpret fetch failed', err);
        addAiMessage('<p>Network error while calling /api/interpret — using local fallback.</p>');
        const facts = parser.parse(text);
        addAiMessage(`<p>Local fallback detected mount: <strong>${facts.mount || 'unknown'}</strong>, sign: <strong>${facts.sign || 'unknown'}</strong></p><p class="text-gray-500 text-sm mt-3">Ensure your Netlify function /api/interpret is deployed and reachable.</p>`);
      }
    }

    // UI wiring (safe)
    safeAddListener('user-input', 'keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    safeAddListener('btn-scan', 'click', () => {
      // present the "analyze" simulation and then show chat interface as before
      const handImage = document.getElementById('hand-image');
      if (!handImage || !handImage.src || handImage.style.opacity === '0') {
        addAiMessage("Please upload a palm photo first. Tap the scanning area to select your file.");
        return;
      }
      // simulate scanning UI progress (same behavior as your backup)
      const scannerLine = document.getElementById('scanner-line');
      const resultIdle = document.getElementById('result-idle');
      const resultLoading = document.getElementById('result-loading');
      const chatInterface = document.getElementById('chat-interface');
      if (chatInterface) chatInterface.classList.add('hidden');
      if (btnScan) { btnScan.disabled = true; btnScan.innerText = 'Analyzing...'; btnScan.classList.add('opacity-50','cursor-not-allowed'); }
      if (scannerLine) setTimeout(()=> { scannerLine.style.display = 'block'; }, 100);
      setTimeout(()=> {
        if (resultIdle) resultIdle.style.display = 'none';
        if (resultLoading) { resultLoading.style.opacity = '1'; resultLoading.style.pointerEvents = 'auto'; }
      }, 300);
      setTimeout(()=> {
        if (scannerLine) scannerLine.style.display = 'none';
        if (resultLoading) { resultLoading.style.opacity = '0'; resultLoading.style.pointerEvents = 'none'; }
        setTimeout(()=> {
          if (chatInterface) { chatInterface.classList.remove('hidden'); setTimeout(()=> chatInterface.classList.remove('opacity-0'), 50); }
          if (btnScan) { btnScan.disabled = false; btnScan.innerText = 'Analyze Again'; btnScan.classList.remove('opacity-50','cursor-not-allowed'); }
          addAiMessage("The ancient grid is active. I have analyzed the topography of your palm. <br><br>Now, try asking about the signs on your hand, like the <strong>Star on the Sun Mount</strong> or the <strong>Cross on Jupiter</strong>.");
        }, 300);
      }, 4000);
    });

    // file upload wiring safe
    safeAddListener('scan-area', 'click', () => { const fileInput = document.getElementById('file-upload'); if (fileInput) fileInput.click(); });
    safeAddListener('file-upload', 'change', function(ev) {
      const handImage = document.getElementById('hand-image');
      const uploadState = document.getElementById('upload-state');
      const btnScanLocal = document.getElementById('btn-scan');
      if (ev.target.files && ev.target.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => {
          if (handImage) { handImage.src = e.target.result; handImage.style.opacity = '0.8'; }
          if (uploadState) uploadState.style.opacity = '0';
          if (btnScanLocal) { btnScanLocal.disabled = false; btnScanLocal.innerText = 'Analyze Palm'; btnScanLocal.classList.remove('opacity-50','cursor-not-allowed'); }
        };
        reader.readAsDataURL(ev.target.files[0]);
      }
    });

    // small helpers exposed if you want manual testing
    window.astrolens = { sendMessage };

    // navbar scroll effect (safe)
    window.addEventListener('scroll', () => {
      const navbar = document.getElementById('navbar');
      if (!navbar) return;
      if (window.scrollY > 50) navbar.classList.add('bg-[#0a0a0c]/90','backdrop-blur-lg','border-b','border-white/5'); else navbar.classList.remove('bg-[#0a0a0c]/90','backdrop-blur-lg','border-b','border-white/5');
    });

  }); // DOMContentLoaded end
  </script>
