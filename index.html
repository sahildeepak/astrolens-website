<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Astrolens | Modern Palmistry</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Manrope:wght@200;400;600&display=swap" rel="stylesheet">
  <style>
    /* (your existing CSS unchanged) */
    :root { --font-heading: 'Cormorant Garamond', serif; --font-body: 'Manrope', sans-serif; --color-gold: #D4AF37; --color-bg:#0a0a0c; --color-surface:#141418; }

  </style>
</head>
<body class="relative bg-[#0a0a0c]">

  <div class="grain-overlay"></div>

  <!-- (the entire page HTML remains unchanged) -->
  <!-- header, nav, about, reader-app, services, journal, footer -->
  <!-- I am intentionally keeping the markup identical; only the <script> below is changed. -->
  <!-- Paste your existing HTML markup for all sections here unchanged (header/sections/footer) -->
  <!-- ... -->

  <!-- IMPORTANT: trimmed markup above for brevity in this message.
       When you paste this file, keep all your original HTML content identical
       up to the <script> tag. The script below is the modified part. -->

  <script>
document.addEventListener('DOMContentLoaded', () => {
  // --- element refs (after DOM ready) ---
  const chatMessages = document.getElementById('chat-messages');
  const userInput = document.getElementById('user-input');
  const scanArea = document.getElementById('scan-area');
  const fileUploadInput = document.getElementById('file-upload');
  const btnScan = document.getElementById('btn-scan');
  const resultIdle = document.getElementById('result-idle');
  const resultLoading = document.getElementById('result-loading');
  const chatInterface = document.getElementById('chat-interface');
  const uploadState = document.getElementById('upload-state');
  const handImage = document.getElementById('hand-image');
  const scannerLine = document.getElementById('scanner-line');

  // --- small safe helpers ---
  function safeAppendToChat(node) { if (!chatMessages) return; chatMessages.appendChild(node); scrollToBottom(); }
  function scrollToBottom() { if (!chatMessages) return; chatMessages.scrollTop = chatMessages.scrollHeight; }

  // --- typing indicator ---
  function showTyping() {
    if (!chatMessages) return;
    const typingDiv = document.createElement('div');
    typingDiv.className = 'chat-bubble-ai typing-indicator';
    typingDiv.id = 'typing-indicator';
    typingDiv.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
    safeAppendToChat(typingDiv);
  }
  function removeTyping() {
    const t = document.getElementById('typing-indicator');
    if (t) t.remove();
  }

  // --- message creators ---
  function addAiMessage(html) {
    if (!chatMessages) return;
    const bubble = document.createElement('div');
    bubble.className = 'chat-bubble-ai';
    bubble.innerHTML = html;
    safeAppendToChat(bubble);
  }
  function addUserMessage(text) {
    if (!chatMessages) return;
    const bubble = document.createElement('div');
    bubble.className = 'chat-bubble-user';
    bubble.innerText = text;
    safeAppendToChat(bubble);
  }

  // --- UI: format server response into HTML identical to previous design ---
  function formatInterpretation(serverResp) {
    const facts = (serverResp && serverResp.facts) || {};
    const event = (serverResp && serverResp.event) || null;

    if (event && event.type === 'reading_match') {
      const r = event.params;
      return `
        <span class="text-amber-500 font-bold uppercase text-xs tracking-widest">${r.planet}</span>
        <p class="text-gray-400 text-[10px] mb-2">Activation Age: ${r.age}</p>
        <p class="mb-3">${r.prediction}</p>
        <div class="bg-amber-900/20 border-l-2 border-amber-500 p-2 mt-2">
          <p class="text-xs text-amber-200"><strong>Lal Kitab Remedy:</strong> ${r.remedy}</p>
        </div>
      `;
    } else if (event && event.type === 'no_sign_match') {
      return `<p>${event.params.message}</p><p class="text-gray-500 text-sm mt-3">Try asking about another sign like <strong>Star, Cross, or Vertical Line</strong>.</p>`;
    } else {
      const mountLabel = facts.mount ? facts.mount.toUpperCase() : 'Unknown';
      const signLabel = facts.sign ? facts.sign.toUpperCase() : 'Unknown';
      const confidence = typeof facts.confidence === 'number' ? facts.confidence.toFixed(2) : '0.00';
      return `
        <p class="text-gray-200 mb-2"><strong>Detected</strong> — Mount: <span class="text-amber-500">${mountLabel}</span>, Sign: <span class="text-amber-500">${signLabel}</span></p>
        <p class="text-gray-400 text-sm mb-2">Confidence: ${confidence}</p>
        <p class="text-gray-400 text-sm">I couldn't find a precise Lal Kitab match for that combination. Try asking about a specific sign (e.g., <strong>"Star on Sun"</strong>).</p>
      `;
    }
  }

  // --- sendMessage: posts to /api/interpret and renders the response ---
  async function sendMessage() {
    const text = (userInput && userInput.value || '').trim();
    if (!text) return;

    addUserMessage(text);
    if (userInput) userInput.value = '';
    showTyping();

    try {
      const resp = await fetch('/api/interpret', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });

      removeTyping();

      if (!resp.ok) {
        let errText = `The oracle is silent (status ${resp.status})`;
        try { const j = await resp.json(); if (j && j.error) errText = `Error: ${j.error}`; } catch (_) {}
        addAiMessage(`<p>${errText}</p>`);
        return;
      }

      const data = await resp.json();
      const html = formatInterpretation(data);
      addAiMessage(html);
    } catch (err) {
      removeTyping();
      console.error('fetch /api/interpret error', err);
      addAiMessage('<p>The oracle could not be reached. Please try again later.</p>');
    }
  }

  // expose so the button can call it
  window.sendMessage = sendMessage;

  // --- file upload interactions (guarded) ---
  if (scanArea) {
    scanArea.addEventListener('click', () => {
      if (fileUploadInput) fileUploadInput.click();
    });
  }
  if (fileUploadInput) {
    fileUploadInput.addEventListener('change', function (e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        if (handImage) { handImage.src = ev.target.result; handImage.style.opacity = '0.8'; }
        if (uploadState) uploadState.style.opacity = '0';
        if (btnScan) {
          btnScan.disabled = false;
          btnScan.innerText = 'Analyze Palm';
          btnScan.classList.remove('opacity-50','cursor-not-allowed');
        }
      };
      reader.readAsDataURL(file);
    });
  }

  // --- scan simulation UI functions (kept UX from your original) ---
  window.startSimulation = function () {
    if (!handImage || !handImage.src || handImage.style.opacity === '0') {
      addAiMessage("Please upload a palm photo first. Tap the scanning area to select your file.");
      return;
    }
    if (scannerLine) scannerLine.style.display = 'block';
    if (chatInterface) chatInterface.classList.add('hidden');
    if (btnScan) { btnScan.disabled = true; btnScan.innerText = 'Analyzing...'; btnScan.classList.add('opacity-50','cursor-not-allowed'); }

    setTimeout(() => {
      if (resultIdle) resultIdle.style.display = 'none';
      if (resultLoading) { resultLoading.style.opacity = '1'; resultLoading.style.pointerEvents = 'auto'; }
    }, 300);

    setTimeout(() => {
      if (scannerLine) scannerLine.style.display = 'none';
      if (resultLoading) { resultLoading.style.opacity = '0'; resultLoading.style.pointerEvents = 'none'; }
      setTimeout(() => {
        if (chatInterface) { chatInterface.classList.remove('hidden'); setTimeout(()=>chatInterface.classList.remove('opacity-0'), 50); }
        if (btnScan) { btnScan.disabled = false; btnScan.innerText = 'Analyze Again'; btnScan.classList.remove('opacity-50','cursor-not-allowed'); }
        addAiMessage("The ancient grid is active. I have analyzed the topography of your palm. <br><br>Now, try asking about the signs on your hand, like the <strong>Star on the Sun Mount</strong> or the <strong>Cross on Jupiter</strong>.");
      }, 300);
    }, 4000);
  };

  window.resetSimulation = function () {
    if (chatMessages) chatMessages.innerHTML = '';
    if (fileUploadInput) fileUploadInput.value = '';
    if (scannerLine) scannerLine.style.display = 'none';
    if (handImage) handImage.style.opacity = '0';
    setTimeout(() => { if (uploadState) uploadState.style.opacity = '1'; }, 500);
    if (chatInterface) { chatInterface.classList.add('opacity-0'); setTimeout(()=>{ chatInterface.classList.add('hidden'); if (resultIdle) resultIdle.style.display = 'flex'; setTimeout(()=>{ if (resultIdle) resultIdle.style.opacity = '1'; },100); }, 300); }
  };

  // enter key sends message (guarded)
  if (userInput) userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

  // Navbar scroll effect (guarded)
  window.addEventListener('scroll', () => {
    const navbar = document.getElementById('navbar');
    if (!navbar) return;
    if (window.scrollY > 50) navbar.classList.add('bg-[#0a0a0c]/90','backdrop-blur-lg','border-b','border-white/5'); else navbar.classList.remove('bg-[#0a0a0c]/90','backdrop-blur-lg','border-b','border-white/5');
  });

}); // end DOMContentLoaded
</script>
</body>
</html>
